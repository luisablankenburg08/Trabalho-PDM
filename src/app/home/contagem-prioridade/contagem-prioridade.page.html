<ion-header>
  <ion-toolbar>
    <ion-title>Contagem por Prioridade</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen="true">
  <fieldset>
    <legend>Contagem de Tarefas por Prioridade</legend>
    <p><strong>Alta Prioridade:</strong> {{ contagem.alta }}</p>
    <p><strong>Média Prioridade:</strong> {{ contagem.media }}</p>
    <p><strong>Baixa Prioridade:</strong> {{ contagem.baixa }}</p>
    <ion-button (click)="voltar()" color="danger">Voltar</ion-button>
  </fieldset>
</ion-content>
