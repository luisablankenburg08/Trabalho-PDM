<ion-header>
  <ion-toolbar>
    <ion-title>Produtos</ion-title>
  </ion-toolbar>
</ion-header>


<body>

  <!-- Listar Produtos-->
    <fieldset>
      <legend>Produtos</legend>
      <div *ngFor="let produto of produtos" class="resultado">
        <p><strong>Nome:</strong> {{ produto.nome }}</p>
        <p><strong>Preço:</strong> {{ formatarPreco(produto.preco) }}</p>
        <p><strong>Estoque:</strong> {{ produto.estoque }}</p>
        <hr>
      </div>
      <ion-button class="botaovoltar" (click)="voltar()">
      Voltar
      </ion-button>
    </fieldset>

</body>
